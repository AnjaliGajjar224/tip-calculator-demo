<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator</title>
  <style>
:root {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #202c48;
  background: #eef0fa;
  color-scheme: light;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 32px 20px;
  background: radial-gradient(ellipse at top left, #dddafa, transparent 65%),
              radial-gradient(ellipse at bottom right, #d8f0ed, transparent 65%);
}

.calculator {
  width: 100%;
  max-width: 460px;
  padding: 40px;
  border: 1px solid #ffffff;
  border-radius: 28px;
  background: #ffffff;
  box-shadow: 0 24px 64px #30396918, 0 4px 12px #30396908;
}

.eyebrow { margin: 0; font-size: 0.7rem; font-weight: 750; letter-spacing: 0.16em; color: #6152b6; }
h1 { margin: 14px 0 12px; font-size: clamp(1.8rem, 6vw, 2.2rem); letter-spacing: -0.045em; line-height: 1.15; }
.intro, .note { color: #65708a; line-height: 1.6; }
.intro { margin: 0 0 32px; }
label, legend { font-size: 0.9rem; font-weight: 650; }

input {
  width: 100%;
  margin-top: 12px;
  padding: 16px;
  border: 1px solid #cbd0e2;
  border-radius: 14px;
  background: #f8f9fd;
  color: inherit;
  font: inherit;
  font-size: 1.4rem;
  font-variant-numeric: tabular-nums;
}
input::placeholder { color: #767f96; }
input:focus { border-color: #6550c8; background: #fff; }
input[aria-invalid="true"] { border-color: #b52f42; }

fieldset { border: 0; padding: 0; margin: 12px 0 28px; min-width: 0; }
.tip-options { display: flex; gap: 12px; margin-top: 14px; }
button {
  flex: 1;
  min-width: 0;
  min-height: 54px;
  border: 1px solid #dce0ee;
  border-radius: 14px;
  background: #f5f6fc;
  color: #485274;
  font: inherit;
  font-size: 1.05rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 150ms, box-shadow 150ms, border-color 150ms;
}
button:hover { background: #eae7fb; border-color: #aaa0df; }
button[aria-pressed="true"] {
  background: #6046bf;
  color: white;
  border-color: #6046bf;
  box-shadow: 0 4px 12px #6046bf30;
}
button[aria-pressed="true"]:hover { background: #5036a9; }
:focus-visible { outline: 3px solid #9178e3; outline-offset: 4px; }
.error { min-height: 1.25em; margin: 8px 0 12px; font-size: 0.8rem; color: #a02c3e; line-height: 1.5; }
.results { background: #f0eefb; border: 1px solid #e6e1f7; border-radius: 18px; padding: 24px; }
.results div { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
.results span { font-size: 0.9rem; }
output { min-width: 0; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; text-align: right; }
.total { border-top: 1px solid #d9d2ee; margin-top: 20px; padding-top: 20px; }
.total span { font-weight: 650; }
.total output { font-size: 1.8rem; color: #5036a9; letter-spacing: -0.04em; }
.note { text-align: center; font-size: 0.75rem; margin: 24px 0 0; }
@media (max-width: 400px) {
  body { padding: 20px 16px; }
  .calculator { padding: 28px 22px; border-radius: 24px; }
  .results { padding: 20px 16px; }
  .tip-options { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  button { transition: none; }
}
  </style>
</head>
<body>
  <main class="calculator">
    <p class="eyebrow">A LITTLE THANK YOU</p>
    <h1>Tip calculator</h1>
    <p class="intro">Enter your bill and choose a tip. We’ll do the math.</p>

    <label for="bill">Bill amount ($)</label>
    <input id="bill" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" aria-describedby="error">
    <p id="error" class="error" aria-live="polite"></p>

    <fieldset>
      <legend>Choose your tip</legend>
      <div class="tip-options">
        <button type="button" data-tip="10" aria-pressed="false">10%</button>
        <button type="button" data-tip="15" aria-pressed="true">15%</button>
        <button type="button" data-tip="20" aria-pressed="false">20%</button>
      </div>
    </fieldset>

    <section class="results" aria-live="polite" aria-atomic="true" aria-label="Calculated amounts">
      <div><span>Tip amount</span><output id="tip">$0.00</output></div>
      <div class="total"><span>Bill total</span><output id="total">$0.00</output></div>
    </section>
    <p class="note">A small gesture goes a long way.</p>
  </main>
  <noscript>Please enable JavaScript to calculate your tip.</noscript>
  <!-- Keep scripts after the controls so they exist before JavaScript runs. -->
  <script id="calculation">
// Work in whole cents to keep displayed money amounts consistent.
function calculateTip(billAmount, tipPercent) {
  if (!Number.isFinite(billAmount) || billAmount < 0 ||
      !Number.isFinite(tipPercent) || tipPercent < 0) {
    throw new Error('Bill amount and tip percentage must be finite, non-negative numbers.');
  }

  // Shift the decimal using exponent notation before rounding. Multiplying
  // by 100 directly can turn 10.075 into 1007.4999999999999.
  const [digits, exponent = '0'] = billAmount.toString().split('e');
  const billCents = Math.round(Number(digits + 'e' + (Number(exponent) + 2)));
  const tipCents = Math.round(billCents * tipPercent / 100);
  const totalCents = billCents + tipCents;

  if (!Number.isSafeInteger(billCents) || !Number.isSafeInteger(tipCents) ||
      !Number.isSafeInteger(totalCents)) {
    throw new Error('Amount is too large to calculate accurately.');
  }

  return { tip: tipCents / 100, total: totalCents / 100 };
}
  </script>
  <script id="interface">
const billInput = document.querySelector('#bill');
const tipButtons = document.querySelectorAll('[data-tip]');
const tipOutput = document.querySelector('#tip');
const totalOutput = document.querySelector('#total');
const errorMessage = document.querySelector('#error');
const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
let selectedTip = 15;

function updateResults() {
  errorMessage.textContent = '';
  billInput.removeAttribute('aria-invalid');

  // An empty field starts with zero; malformed or negative input shows an error.
  if (billInput.value === '' && !billInput.validity.badInput) {
    tipOutput.textContent = money.format(0);
    totalOutput.textContent = money.format(0);
    return;
  }

  try {
    const result = calculateTip(billInput.valueAsNumber, selectedTip);
    tipOutput.textContent = money.format(result.tip);
    totalOutput.textContent = money.format(result.total);
  } catch (error) {
    errorMessage.textContent = 'Enter a valid, non-negative bill amount within a supported range.';
    billInput.setAttribute('aria-invalid', 'true');
    tipOutput.textContent = '—';
    totalOutput.textContent = '—';
  }
}

billInput.addEventListener('input', updateResults);
tipButtons.forEach(function (button) {
  button.addEventListener('click', function () {
    selectedTip = Number(button.dataset.tip);
    tipButtons.forEach(function (tipButton) {
      tipButton.setAttribute('aria-pressed', String(tipButton === button));
    });
    updateResults();
  });
});
updateResults();
  </script>
</body>
</html>
